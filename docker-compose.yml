# PROD — full stack. `docker compose up` brings up MySQL, Redis, the Laravel API,
# the Next.js web client, and a Caddy reverse proxy that serves both on port 80.
#
# Real MySQL/Redis/Caddy/Next serve PROD itself. The in-game MySQL/Redis/Nginx/…
# are only simulation entities computed in the browser — none run here.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-prod}
      MYSQL_USER: ${DB_USERNAME:-prod}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-please}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD:-change-me-root}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      CONTENT_PATH: /content/data
    volumes:
      - ./packages/content/data:/content/data:ro
      - api-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      CONTENT_PATH: /content/data
    command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3']
    volumes:
      - ./packages/content/data:/content/data:ro
      - api-storage:/var/www/html/storage
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/api/public:/var/www/html/public:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  mysql-data:
  redis-data:
  api-storage:
  caddy-data:
  caddy-config:
